<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DHCS Change Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* A tracked-changes reader. The whole newer notice reads top to bottom with its
   changes marked in place; the reason for each change sits in the margin beside it.
   Substantive changes get the full redline, minor edits stay faint, formatting is
   hidden. The outline on the left is the notice's own structure. */
:root {
  --bg: #F6F7F6; --panel: #FFFFFF; --sunk: #EEF1F0; --ink: #16222A; --mute: #66737A; --faint: #9AA5AA; --line: #DDE3E1;
  --accent: #155E75; --accent-soft: #E1EEF2;
  --add: #17603A; --add-bg: #DDF2E4; --del: #A3301F; --del-bg: #FCE7E3;
  --ui: "Public Sans", "Helvetica Neue", Arial, sans-serif;
  --read: "Source Serif 4", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11191E; --panel: #172228; --sunk: #1D2A31; --ink: #E3EAEC; --mute: #9AA9B0; --faint: #6E7E86; --line: #2A3840;
    --accent: #6FC3DB; --accent-soft: #1B3540; --add: #8FDCAD; --add-bg: #17392A; --del: #F4A095; --del-bg: #45211C; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11191E; --panel: #172228; --sunk: #1D2A31; --ink: #E3EAEC; --mute: #9AA9B0; --faint: #6E7E86; --line: #2A3840;
  --accent: #6FC3DB; --accent-soft: #1B3540; --add: #8FDCAD; --add-bg: #17392A; --del: #F4A095; --del-bg: #45211C; color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--ui); }
* { box-sizing: border-box; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

.app { --tocw: 300px; display: grid; grid-template-columns: var(--tocw) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); height: 100%; }

/* Top bar: which document */
.docs { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--sunk); padding: 3px; gap: 3px; margin-left: auto; }
.docs button { border: 0; background: none; border-radius: 7px; padding: 6px 14px; cursor: pointer; font-weight: 600; font-size: 14px; display: grid; text-align: left; line-height: 1.2; }
.docs button small { font-weight: 400; font-size: 11.5px; color: var(--mute); }
.docs button[aria-pressed="true"] { background: var(--panel); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.loading { color: var(--mute); padding: 40px 0; }
.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px 28px; flex-wrap: wrap; padding: 12px 24px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { font-weight: 700; font-size: 16px; letter-spacing: -.01em; }
.brand small { display: block; font-weight: 400; font-size: 12.5px; color: var(--mute); letter-spacing: 0; }
.cmp { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13.5px; color: var(--mute); }
.cmp select { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 7px 10px; font-weight: 600; color: var(--ink); min-height: 38px; }

/* Left column: the version picker, then the outline */
.side { background: var(--panel); border-right: 1px solid var(--line); overflow: auto; min-height: 0; position: relative; }
.pick { position: sticky; top: 0; z-index: 4; margin: 0; padding: 16px 14px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
.pick > .in { padding: 14px 14px 12px; border-radius: 12px; background: var(--accent-soft); display: grid; gap: 8px; }
.pick .ph { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--accent); }
.pick .pair { font-family: var(--mono); font-size: 17px; font-weight: 500; color: var(--ink); line-height: 1.3; }
.pick .pair span { color: var(--mute); padding: 0 4px; }
.pick label { display: grid; grid-template-columns: 40px minmax(0, 1fr); align-items: center; gap: 6px; font-size: 12.5px; color: var(--mute); }
.pick select { width: 100%; border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); border-radius: 8px; background: var(--panel); padding: 7px 8px; font-weight: 600; font-size: 13px; color: var(--ink); min-height: 36px; }
.pick .quick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.pick .quick button { border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--line)); background: var(--panel); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; cursor: pointer; }
.pick .quick button[aria-pressed="true"] { background: var(--accent); color: var(--panel); border-color: var(--accent); }
.dlrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; margin-top: 10px; }
.dlrow select { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 6px 8px; font-size: 13px; min-height: 34px; }
.dlb { border: 0; border-radius: 8px; background: var(--ink); color: var(--panel); padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
.dlb:hover { background: var(--accent); }
.pick .hint { font-size: 12px; color: var(--mute); line-height: 1.4; }
.toc { padding: 10px 0 28px; }
.toc h2 { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); margin: 0 20px 10px; font-weight: 600; }

.tree, .tree ul { list-style: none; margin: 0; padding: 0; }
.tree .row { display: grid; grid-template-columns: 18px minmax(0, 1fr); align-items: center; padding-left: 8px; }
.tree .row.d1 { padding-left: 20px; } .tree .row.d2 { padding-left: 32px; } .tree .row.d3 { padding-left: 44px; } .tree .row.d4 { padding-left: 56px; } .tree .row.d5 { padding-left: 68px; }
.toch { display: flex; justify-content: space-between; align-items: baseline; margin: 0 14px 10px 20px; }
.toch h2 { margin: 0 !important; }
.toch button { border: 0; background: none; padding: 0 0 0 10px; color: var(--accent); cursor: pointer; font-size: 12px; }
.tree .row.hit a .tt { color: var(--ink); font-weight: 600; }
.tree a[data-hits]::after { content: attr(data-hits); font-size: 11px; font-weight: 600; color: var(--ink); background: var(--mark); border-radius: 999px; padding: 0 6px; margin-left: 4px; align-self: center; }
.toc a { grid-template-columns: 10px auto minmax(0, 1fr) auto !important; }
mark.hit { background: var(--mark); color: inherit; border-radius: 2px; }
.qdrop { position: absolute; top: calc(100% + 6px); right: 0; width: max(100%, 380px); max-height: 60vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.14); padding: 6px; z-index: 12; }
.qdrop .qh { font-size: 12.5px; color: var(--mute); padding: 6px 8px 8px; } .qdrop .qh b { color: var(--ink); }
.qdrop button { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: baseline; width: 100%; text-align: left; border: 0; background: none; border-radius: 6px; padding: 7px 8px; cursor: pointer; font-size: 13.5px; }
.qdrop button:hover { background: var(--sunk); }
.qdrop .lb { font-family: var(--mono); font-size: 12px; color: var(--accent); }
.qdrop .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qdrop .n { font-size: 12px; font-weight: 600; background: var(--mark); border-radius: 999px; padding: 0 7px; font-variant-numeric: tabular-nums; }
.rsum { margin: 0 16px 10px 20px; font-size: 13px; color: var(--mute); line-height: 1.45; } .rsum b { color: var(--ink); }
.rf { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 14px 12px 20px; }
.rf button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; }
.rf button b { font-weight: 600; margin-left: 2px; } .rf button[disabled] { opacity: .45; cursor: default; }
.rf button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.rh { margin: 0 14px 14px 20px; padding: 10px 8px 8px; border: 1px solid var(--line); border-radius: 10px; }
.rhl { font-size: 11.5px; color: var(--mute); margin-bottom: 6px; }
.rhs { display: flex; gap: 2px; align-items: stretch; }
.rv { flex: 1 1 0; min-width: 0; border: 0; background: none; padding: 2px 0 0; display: grid; grid-template-rows: 28px auto auto 13px; align-items: end; justify-items: center; gap: 1px; cursor: pointer; font-size: 11px; color: var(--mute); }
.rv[disabled] { cursor: default; }
.rv i { display: block; width: 70%; max-width: 30px; background: var(--line); border-radius: 3px 3px 0 0; }
.rv.on i { background: var(--accent); }
.rv b { font-size: 12.5px; color: var(--ink); font-variant-numeric: tabular-nums; }
.rv span { font-family: var(--mono); font-size: 9.5px; letter-spacing: -.02em; white-space: nowrap; }
.rv em { font-style: normal; font-weight: 600; font-size: 10.5px; } .rv em.up { color: var(--add); } .rv em.dn { color: var(--del); }
.rv:not([disabled]):hover span { color: var(--accent); text-decoration: underline; }
.rj { margin: 0 14px 12px 20px; display: grid; gap: 4px; }
.rj a { display: block !important; padding: 7px 10px !important; border: 1px solid var(--accent); border-radius: 8px; font-size: 13px; }
.rj a span { color: var(--mute); font-size: 12px; }
.rl { list-style: none; margin: 0; padding: 0; }
.rl > li { border-top: 1px solid var(--line); padding: 8px 14px 8px 20px; }
.rg { display: flex; gap: 8px; align-items: baseline; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.rg .tt { flex: 1; min-width: 0; }
.rs { font-size: 10.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--mute); white-space: nowrap; } .rs.sub { color: var(--accent); }
.rr { display: grid; gap: 2px; width: 100%; text-align: left; border: 0; background: none; border-radius: 6px; padding: 5px 6px; margin-left: -6px; cursor: pointer; }
.rr:hover, .rr.now { background: var(--sunk); } .rr.now { box-shadow: inset 2px 0 0 var(--accent); }
.rk { font-size: 10.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--faint); }
.rk.add { color: var(--add); } .rk.del { color: var(--del); } .rk.near { color: var(--accent); }
.sn { font-size: 12.5px; line-height: 1.4; color: var(--mute); } .sn b { color: var(--ink); background: var(--mark); border-radius: 2px; font-weight: 600; }
.rm { border: 0; background: none; color: var(--accent); font-size: 12px; cursor: pointer; padding: 2px 0; }
mark.hit.now { background: var(--accent); color: var(--panel); }
.search { position: relative; flex: 1 1 220px; max-width: 360px; display: flex; align-items: center; }
.search input { width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 7px 70px 7px 30px; min-height: 36px; font-size: 13.5px; }
.search::before { content: "⌕"; position: absolute; left: 10px; color: var(--mute); font-size: 15px; }
.search .cnt { position: absolute; right: 10px; font-size: 12px; color: var(--mute); font-variant-numeric: tabular-nums; }
.tw { border: 0; background: none; padding: 0; width: 18px; height: 26px; color: var(--mute); cursor: pointer; font-size: 11px; transition: transform .15s; }
.tw[aria-expanded="true"] { transform: rotate(90deg); }
.toc .d.in { opacity: .45; }
.toc .key i { display: inline-block; }
.grip { position: absolute; top: 0; right: 0; width: 7px; height: 100%; cursor: col-resize; z-index: 3; }
.grip:hover, .grip.drag { background: var(--accent-soft); }
.toc a { display: grid; grid-template-columns: 10px auto minmax(0, 1fr); gap: 8px; align-items: baseline; padding: 4px 16px 4px 17px; border-left: 3px solid transparent; color: var(--ink); text-decoration: none; font-size: 13px; line-height: 1.35; }
.toc a:hover { background: var(--sunk); }
.toc a.on { border-left-color: var(--accent); background: var(--accent-soft); }
.toc a { padding-left: 4px; padding-right: 14px; border-radius: 6px; border-left: 0; }
.row.d0 a { font-weight: 600; } .row.d2 a, .row.d3 a, .row.d4 a, .row.d5 a { font-size: 12.5px; color: var(--mute); }
.toc a.on { box-shadow: inset 3px 0 0 var(--accent); }
.toc .d { width: 8px; height: 8px; border-radius: 50%; align-self: center; box-sizing: border-box; }
.toc .d.sub { background: var(--accent); }
.toc .d.minor { border: 1.5px solid var(--faint); }
.toc .d.dim { background: var(--faint); opacity: .5; }
.toc .lb { font-family: var(--mono); font-size: 11.5px; color: var(--mute); }
.toc .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side.wide .tt { white-space: normal; }
.toc .key { margin: 18px 20px 0; font-size: 12px; color: var(--mute); display: grid; gap: 4px; }
.toc .key span { display: flex; gap: 8px; align-items: center; }

/* Reading area */
.main { overflow: auto; min-width: 0; }
.bar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1120px; margin: 0 auto; padding: 10px 32px; display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap; }
.nav { display: flex; align-items: center; gap: 4px; }
.nav .lbl { font-size: 13.5px; color: var(--mute); margin-right: 6px; }
.nav .pos { font-weight: 600; font-variant-numeric: tabular-nums; min-width: 64px; text-align: center; font-size: 14px; }
.ib { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; width: 36px; height: 36px; cursor: pointer; font-size: 16px; line-height: 1; }
.ib:hover { border-color: var(--accent); color: var(--accent); }
.sel { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 7px 10px; min-height: 36px; font-size: 13.5px; }
.tg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); font-size: 13px; }
.tg button { border: 0; background: none; padding: 7px 11px; cursor: pointer; min-height: 34px; }
.tg button + button { border-left: 1px solid var(--line); }
.tg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.tg .cap { padding: 7px 4px 7px 11px; color: var(--mute); }
.spacer { margin-left: auto; }
.navk button { padding: 7px 12px; } .navk b { font-weight: 600; margin-left: 4px; font-variant-numeric: tabular-nums; }
.ck { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; cursor: pointer; color: var(--ink); }
.ck input { width: 16px; height: 16px; accent-color: var(--accent); }
.view { position: relative; }
.view summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.view summary::-webkit-details-marker { display: none; }
.view summary::after { content: "▾"; font-size: 11px; color: var(--mute); }
.view .menu { position: absolute; right: 0; top: calc(100% + 6px); width: 300px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.12); padding: 12px 14px; display: grid; gap: 10px; z-index: 10; }
.view .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13.5px; }
.view .menu p { margin: 0; font-size: 12px; color: var(--mute); }
.contents { display: none; }
.pairbtn { display: none; border: 1px solid var(--line); background: var(--accent-soft); color: var(--ink); border-radius: 8px; padding: 6px 10px; font-family: var(--mono); font-size: 12.5px; cursor: pointer; min-height: 36px; }

.doc { max-width: 1180px; margin: 0 auto; padding: 28px 40px 120px; }
.doc > .sum, .doc > .foot, .sec > .txt { max-width: 800px; }
.pp { position: relative; }
.sec { padding: 6px 0; }
.sec > .txt { min-width: 0; }
/* Change bars: a rule in the left gutter beside each paragraph that changed. */
.pp { margin: 0 0 .75em; }
.pp.cb { border-left: 3px solid var(--accent); padding-left: 14px; margin-left: -17px; }
.sec.quiet .pp.cb { border-left: 2px dotted var(--faint); padding-left: 15px; }
.cur .callout { animation: flash 1.6s ease-out 1; }
@keyframes flash { 0% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 3px transparent; } }
/* The reason for a change, placed right above the first paragraph it applies to. */
/* Margin comments: each sits level with the first paragraph it is about,
   joined to it by a hairline. layoutNotes() nudges overlapping ones down. */
.callout { position: absolute; left: calc(100% + 40px); top: 0; width: 290px; padding: 2px 0 2px 12px; border-left: 2px solid var(--accent); font-family: var(--ui); font-size: 13.5px; line-height: 1.5; display: grid; gap: 4px; white-space: normal; color: var(--ink); transition: top .15s; }
.callout::before { content: ""; position: absolute; right: calc(100% + 2px); top: .8em; width: 38px; border-top: 1px dashed color-mix(in srgb, var(--accent) 55%, transparent); }
.sec.hl .pp.cb { background: var(--accent-soft); }
.sec.hl .callout { border-left-width: 3px; }
.callout .tl { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--accent); display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.callout .tl span { font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--mute); font-size: 12px; }
.callout p { margin: 0; }
.callout .ln { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--mute); }
.callout button { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 12.5px; text-decoration: underline; }
.callout.quiet { border-left-color: var(--line); font-size: 12.5px; color: var(--mute); }
.callout.quiet::before { border-top-color: var(--line); }
.callout.quiet .tl { color: var(--mute); }
.callout.back { border-left-color: var(--faint); color: var(--mute); }
@media (max-width: 1240px) {
  .callout { position: static; width: auto; margin: 4px 0 10px; padding: 8px 12px; border-left-width: 3px; background: var(--accent-soft); border-radius: 0 8px 8px 0; }
  .callout::before { display: none; }
  .callout.quiet, .callout.back { background: var(--sunk); }
}
.h { font-family: var(--ui); margin: 22px 0 8px; line-height: 1.3; letter-spacing: -.005em; }
.h1 { font-size: 25px; margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line); } .h2 { font-size: 21px; } .h3 { font-size: 17.5px; } .h4, .h5, .h6 { font-size: 15.5px; }
.h .lab { font-family: var(--mono); font-weight: 500; color: var(--accent); margin-right: 10px; font-size: .82em; }
.body { font-family: var(--read); font-size: 17px; line-height: 1.68; white-space: pre-wrap; overflow-wrap: anywhere; }
del { background: var(--del-bg); color: var(--del); text-decoration: line-through; text-decoration-thickness: 1.5px; }
ins { background: var(--add-bg); color: var(--add); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
/* Minor edits and changes outside the chosen area: shown, but quiet. */
.sec.chg .note .card { border-left-color: var(--accent); }
.sec.quiet del { background: none; color: var(--faint); text-decoration-thickness: 1px; }
.sec.quiet ins { background: none; color: inherit; text-decoration: underline dotted var(--faint); text-decoration-thickness: 1.5px; }
.sec.gone .body { opacity: .8; }
.pg { display: block; height: .7em; }
.img { font-family: var(--ui); font-size: 13px; color: var(--mute); font-style: italic; }
a.url { font-family: var(--ui); font-size: 11.5px; text-decoration: none; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; white-space: nowrap; }
.tbl { overflow-x: auto; white-space: normal; margin: 8px 0; }
.tbl table { border-collapse: collapse; width: 100%; font-family: var(--ui); font-size: 13.5px; line-height: 1.45; }
.tbl th, .tbl td { border: 1px solid var(--line); padding: 7px 9px; vertical-align: top; text-align: left; min-width: 8em; }
.tbl th { background: var(--sunk); }
.tdel table { text-decoration: line-through; text-decoration-thickness: 1.5px; color: var(--del); background: var(--del-bg); }
.tdel th { background: color-mix(in srgb, var(--del-bg) 70%, var(--sunk)); }
.tins table { color: var(--add); background: var(--add-bg); }
.tins th { background: color-mix(in srgb, var(--add-bg) 70%, var(--sunk)); }
.tdel::before, .tins::before { display: block; font-family: var(--ui); font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; }
.tdel::before { content: "Table removed"; color: var(--del); } .tins::before { content: "Table added"; color: var(--add); }
.sec.quiet .tdel table, .sec.quiet .tins table { background: none; color: inherit; }
.sec.quiet .tdel table { color: var(--faint); }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
.colh { font-family: var(--ui); font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--mute); margin-bottom: 4px; }

/* Margin notes */
.note { padding-top: 26px; font-size: 13.5px; line-height: 1.5; }
.note .card { border-left: 2px solid var(--accent); padding: 2px 0 2px 12px; display: grid; gap: 5px; }

// ---------- summary at the top ----------
// The first sentence of a note, or two if the first is only a lead-in.
function lead(t) { const ss = t.split(/(?<=\.)\s+(?=[A-Z(])/); return ss[0].length < 50 && ss[1] ? ss[0] + ' ' + ss[1] : ss[0]; }

  const subs = DOC.filter(s => s.state === 'sub' || s.state === 'chg'), minors = DOC.filter(s => s.state === 'minor');
  const subject = CFG.docTitle || (S.find(s => s.label === '_chapter') || {}).heading || CFG.topic;
  const cur = V.length - 1;

const chapName = c => ((D.chapters.find(x => x.chapter === c) || {}).heading || c);

// ---------- outline ----------

  const tw = s.kids.length ? `<button class="tw" data-tw="${s.i}" aria-expanded="${isOpen}" aria-label="${isOpen ? 'Collapse' : 'Expand'} ${esc(t)}">&#9656;</button>` : '<span class="tw"></span>';

  return `<li><div class="row d${Math.min(depth, 5)}${inHits ? ' hit' : ''}">${tw}<a href="#" data-go="${s.i}"${hits ? ` data-hits="${hits}"` : ''}><span class="d ${d}"></span><span class="lb">${esc(secLabel(s))}</span><span class="tt">${esc(t)}</span></a></div>${s.kids.length && isOpen ? `<ul>${s.kids.map(tocItem).join('')}</ul>` : ''}</li>`;

    `<div class="key"><span><i class="d sub"></i>${REVIEWED ? 'Substantive change' : 'Changed'}</span><span><i class="d minor"></i>Minor edit</span><span><i class="d sub in"></i>Change inside</span></div>`;

// ---------- the version picker (left column) ----------

// ---------- the bar ----------

// ---------- margin comments ----------
function layoutNotes() {

  if (!notes.length || getComputedStyle(notes[0]).position !== 'absolute') return;
  notes.forEach(n => n.style.top = '0px');
  let last = -Infinity;

    const r = n.getBoundingClientRect();

}
on(window, 'resize', () => { clearTimeout(layoutNotes.t); layoutNotes.t = setTimeout(layoutNotes, 100); });
on(document, 'mouseover', e => { const c = e.target.closest('.callout, .pp.cb'); const sec = c && c.closest('.sec'); document.querySelectorAll('.sec.hl').forEach(x => x !== sec && x.classList.remove('hl')); if (sec) sec.classList.add('hl'); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => layoutNotes());

// ---------- search ----------
// Search knows about changes. Every match is tagged by where it sits in the

    const nodes = []; while (walk.nextNode()) nodes.push(walk.currentNode);

      [...groups].map(([si, g]) => { const x = S[si]; if (!x) return ''; return `<button data-hit="${g.first}"><span class="lb">${esc((MANUAL && x.label !== '_chapter' ? (chapName(x.chapter).match(/^\d+/) || ['App'])[0] + ' · ' : '') + secLabel(x))}</span><span class="tt">${esc(bare(x, x.title1 ?? x.title0 ?? x.title))}</span><span class="n">${g.n}</span></button>`; }).join('')

// ---------- downloads ----------
// A BHIN version is DHCS's own PDF. A manual version is assembled from the
// stored text into one Markdown file (DHCS publishes the manual as web pages).
function versionMarkdown(vi) {
  const ci = c => { const k = D.chapters.findIndex(x => x.chapter === c); return k < 0 ? 999 : k; };
  const secs = S.filter(s => s.texts[vi] != null).sort((x, y) => ci(x.chapter) - ci(y.chapter) || (x.label === '_chapter' ? -1 : 0) - (y.label === '_chapter' ? -1 : 0) || (x.order ?? 999) - (y.order ?? 999));
  const head = `---\ntitle: ${CFG.docTitle}\nversion: ${vNum(vi)}\nreleased: ${vDate(vi)}\nsource: ${srcLink(vi)}\n---\n\n`;
  return head + secs.map(s => { const t = text(s, vi); const lv = s.label === '_chapter' ? 1 : Math.min(Math.max(s.level || 2, 2), 6); return '#'.repeat(lv) + ' ' + t.replace(/^# /, ''); }).join('\n\n') + '\n';
}
async function download(vi) {
  if (!MANUAL) { window.open(srcLink(vi), '_blank', 'noopener'); return; }
  const name = `${CFG.fileStem}-${vNum(vi)}.md`;
  const data = new TextEncoder().encode(versionMarkdown(vi));
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (dl) { await dl.save({ filename: name, data }); return; }
  } catch (e) { if (e && e.code === 'declined') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: 'text/markdown' })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}

// ---------- page ----------
function render(keepScroll) {
  computeTargets();
  const y = $('main').scrollTop;
  $('brand').innerHTML = `Change Tracker<small>${esc(CFG.topic)} &middot; DHCS</small>`;
  renderPick();
  document.querySelector('.app').classList.toggle('minor-off', st.minor === 'off');
  tree(); renderBar(); renderTOC();
  $('doc').innerHTML = summaryHTML() + DOC.map(sectionHTML).join('') +
    `<p class="foot">${esc(CFG.sourceNote)} Punctuation-only and formatting differences are hidden. Which changes are substantive, the notes and the summary are example AI judgments written for this prototype from the exact before-and-after text; they need review by someone who knows the policy.</p>`;
  if (keepScroll) $('main').scrollTop = y;
  if (SEARCH.q) runSearch(); 
  layoutNotes();
  spy.last = null; spy();
}
function goTo(i, behavior = 'smooth', toChange) {
  const sec = $('s' + i); if (!sec) return;
  reveal(S[i]);
  const el = (toChange && (sec.querySelector('.callout') || sec.querySelector('.pp.cb'))) || sec;
  const main = $('main'), bar = document.querySelector('.bar').offsetHeight;
  main.scrollTo({ top: main.scrollTop + el.getBoundingClientRect().top - main.getBoundingClientRect().top - bar - 16, behavior });

  $('side').classList.remove('open');
}

    // Start from where the reader is.

    const idx = TARGETS.findIndex(s => $('s' + s.i).getBoundingClientRect().top > top + 2);
    st.cur = d > 0 ? (idx < 0 ? 0 : idx) : ((idx < 0 ? n : idx) - 1 + n) % n;
  } else st.cur = (st.cur + d + n) % n;
  document.querySelectorAll('.sec.cur').forEach(e => e.classList.remove('cur'));
  const s = TARGETS[st.cur];
  $('s' + s.i).classList.add('cur');

  goTo(s.i, 'smooth', true);
}
// Outline follows the reader.
function spy() {
  const main = $('main');
  const line = main.getBoundingClientRect().top + document.querySelector('.bar').offsetHeight + 24;
  let top = null;
  for (const e of document.querySelectorAll('.sec')) { if (e.getBoundingClientRect().top <= line) top = e; else break; }
  top = top || document.querySelector('.sec');
  if (!top || spy.last === top.dataset.i) return;
  if (!document.querySelector(`.toc a[data-go="${top.dataset.i}"]`)) reveal(S[+top.dataset.i]);
  spy.last = top.dataset.i;
  document.querySelectorAll('.toc a.on').forEach(a => a.classList.remove('on'));
  const a = document.querySelector(`.toc a[data-go="${top.dataset.i}"]`);

on($('main'), 'scroll', () => { if (!spy.raf) spy.raf = requestAnimationFrame(() => { spy.raf = 0; spy(); }); }, { passive: true });

// ---------- events ----------
on(document, 'click', e => {
  const hb = e.target.closest('[data-hit]'); if (hb) { gotoHit(+hb.dataset.hit); renderDrop(false); return; }
  if (!e.target.closest('.search')) renderDrop(false);
  const all = e.target.closest('[data-all]');
  if (all) { if (all.dataset.all === '1') DOC.forEach(x => { if (x.kids && x.kids.length) open.add(x.i); }); else open.clear(); renderTOC(); return; }
  const tw = e.target.closest('[data-tw]');
  if (tw) { const i = +tw.dataset.tw; open.has(i) ? open.delete(i) : open.add(i); renderTOC(); return; }
  const go = e.target.closest('[data-go]');
  if (go) { e.preventDefault(); const i = +go.dataset.go; const k = TARGETS.findIndex(s => s.i === i); if (k >= 0) { st.cur = k; document.querySelectorAll('.sec.cur').forEach(x => x.classList.remove('cur')); $('s' + i).classList.add('cur'); document.querySelector('.nav .pos').textContent = `${k + 1} of ${TARGETS.length}`; } goTo(i, 'smooth', !go.closest('.toc')); return; }

  if (sb) { const i = +sb.dataset.sbs; st.sbs.has(i) ? st.sbs.delete(i) : st.sbs.add(i); const s = S[i]; $('s' + i).outerHTML = sectionHTML(s); if (SEARCH.q) runSearch(true); layoutNotes(); return; }

  if (e.target.closest('#dlgo')) { download(+$('dlv').value); return; }
  const nv = e.target.closest('[data-nav]');
  if (nv) { st.nav = nv.dataset.nav; st.cur = -1; render(true); return; }
  if (e.target.closest('#contents') || e.target.closest('#pairbtn')) { $('side').classList.toggle('open'); return; }
  const qk = e.target.closest('.pick .quick button');
  if (qk) { changePair(+qk.dataset.a, +qk.dataset.b); return; }
  const m = e.target.closest('[data-minor]');
  if (m) { st.minor = m.dataset.minor; store.set('minor', st.minor); render(true); return; }
  if ($('side').classList.contains('open') && !e.target.closest('#side')) $('side').classList.remove('open');
  const vw = document.querySelector('.view'); if (vw && vw.open && !e.target.closest('.view')) vw.open = false;
});
on(document, 'change', e => {
  if (e.target.id === 'area') { st.area = e.target.value; st.cur = -1; render(true); }
  if (e.target.id === 'q') return;
  if (e.target.id === 'clean') { st.clean = e.target.checked; render(true); return; }
  if (e.target.id === 'dlv') { const a = $('dlgo'); a.dataset.v = e.target.value; return; }
  if (e.target.id === 'pickA') changePair(+e.target.value, TO);
  if (e.target.id === 'pickB') changePair(FROM, +e.target.value);
});
on(document, 'keydown', e => {
  if (e.target.id === 'q') {
    if (e.key === 'Enter') { e.preventDefault(); renderDrop(false); nextHit(e.shiftKey ? -1 : 1); }
    if (e.key === 'Escape') { if (!$('qdrop').hidden) renderDrop(false); else { e.target.value = ''; SEARCH.q = ''; runSearch(); } }
    return;
  }
  if (e.target.closest('input, select, textarea')) return;
  if (e.key === '/' ) { e.preventDefault(); $('q').focus(); return; }
  if (e.key === 'j' || e.key === 'n') step(1);
  if (e.key === 'k' || e.key === 'p') step(-1);
});

on(document, 'focusin', e => { if (e.target.id === 'q') renderDrop(true); });
on(document, 'input', e => { if (e.target.id !== 'q') return; clearTimeout(runSearch.t); runSearch.t = setTimeout(() => { SEARCH.q = e.target.value; SEARCH.open = null; runSearch(); }, 220); });
function changePair(a, b) { setPair(a, b); SEARCH.cur = -1; render(); $('main').scrollTop = 0; $('side').classList.remove('open'); try { history.replaceState(null, '', '#' + DOCID + '/' + V[FROM] + '~' + V[TO]); } catch (e) {} }

// Drag the outline's edge to make it wider or narrower.
(function () {
  const saved = +store.get('tocw'); if (saved) document.querySelector('.app').style.setProperty('--tocw', saved + 'px');
  let drag = false;
  on(document, 'pointerdown', e => { if (e.target.id === 'grip') { drag = true; e.target.classList.add('drag'); e.preventDefault(); } });
  on(document, 'pointermove', e => {
    if (!drag) return;
    const w = Math.max(220, Math.min(560, e.clientX));
    document.querySelector('.app').style.setProperty('--tocw', w + 'px');
    $('side').classList.toggle('wide', w > 380);
  });
  on(document, 'pointerup', () => { if (!drag) return; drag = false; const g = $('grip'); if (g) g.classList.remove('drag'); store.set('tocw', parseInt(getComputedStyle(document.querySelector('.app')).getPropertyValue('--tocw'))); });
})();

// ---------- start ----------
(function start() {
  const h = decodeURIComponent(location.hash.slice(1)).replace(/^[^/]*\/?/, '').split('~');
  if (h.length > 3) h[2] = h.slice(2).join('~');
  const a = V.indexOf(h[0]), b = V.indexOf(h[1]);
  const dflt = CFG.defaultPair ? [V.indexOf(CFG.defaultPair[0]), V.indexOf(CFG.defaultPair[1])] : [V.length - 2, V.length - 1];
  if (a >= 0 && b > a) setPair(a, b); else setPair(dflt[0], dflt[1]);
  render();
  const t = h[2] && DOC.find(s => s.key === h[2].replace(/!/g, '~'));
  if (t) setTimeout(() => goTo(t.i, 'auto', true), 0);
})();
}


// ---------- deadlines calendar (mockup) ----------
function calendar(root, data, signal) {
  const ev = data.events.map((e, k) => ({ ...e, k, d: new Date(e.date + 'T12:00:00'), e: e.end ? new Date(e.end + 'T12:00:00') : null }));
  const today = new Date(); today.setHours(12, 0, 0, 0);
  const st = { m: new Date(today.getFullYear(), today.getMonth(), 1), f: 'all', sel: null };
  const LBL = { 'bhsa-manual': 'BHSA Manual', 'bhin-network-adequacy': 'BHINs' };
  const esc = x => String(x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  const fmt = (d, o) => d.toLocaleDateString('en-US', o);
  const link = e => '#' + e.doc + '/' + e.pair.join('~') + (e.section ? '~' + e.section.replace(/~/g, '!') : '');
  const shown = () => ev.filter(e => st.f === 'all' || (st.f === 'changes' ? e.kind === 'issued' || e.changed : e.doc === st.f));
  const sameDay = (a, b) => a.toDateString() === b.toDateString();
  function draw() {
    const list = shown();
    const y = st.m.getFullYear(), mo = st.m.getMonth();
    const start = new Date(y, mo, 1 - new Date(y, mo, 1).getDay(), 12);
    let cells = '';
    for (let k = 0; k < 42; k++) {
      const d = new Date(start); d.setDate(start.getDate() + k);
      if (k === 35 && d.getMonth() !== mo) break;
      const here = list.filter(e => e.kind !== 'period' && sameDay(e.d, d));
      const per = list.filter(e => e.kind === 'period' && d >= e.d && d <= e.e);
      const starts = list.filter(e => e.kind === 'period' && sameDay(e.d, d));
      cells += `<div class="day${d.getMonth() !== mo ? ' out' : ''}${sameDay(d, today) ? ' today' : ''}${per.length ? ' inper' : ''}"><span class="n">${d.getDate()}</span>` +
        starts.concat(here).map(e => `<button class="ev ${e.kind}${e.d < today && e.kind !== 'period' ? ' past' : ''}${st.sel === e.k ? ' sel' : ''}" data-k="${e.k}" title="${esc(e.title)}">${e.kind === 'period' ? '▸ ' : ''}${esc(e.title)}</button>`).join('') + '</div>';
    }
    const upcoming = list.filter(e => (e.e || e.d) >= today).sort((a, b) => a.d - b.d);
    const pick = st.sel != null ? ev[st.sel] : null;
    const items = pick ? [pick].concat(upcoming.filter(e => e !== pick)) : upcoming;
    const days = e => Math.round((e.d - today) / 864e5);
    root.innerHTML = `<div class="calw">
      <h1>Deadlines &amp; changes</h1>
      <p class="lede">What counties must do and when, across the BHSA Manual and BHINs, alongside when DHCS changed the rules. Each date links to the sentence that sets it. <em>Mockup: dates picked by hand; a real version would pull them from the text.</em></p>
      <div class="calbar">
        <div class="tg" role="group" aria-label="Show">${[['all', 'Everything'], ['bhsa-manual', 'BHSA Manual'], ['bhin-network-adequacy', 'BHINs'], ['changes', 'New or changed dates']].map(([k, t]) => `<button data-f="${k}" aria-pressed="${st.f === k}">${t}</button>`).join('')}</div>
        <div class="mnav"><button class="ib" data-m="-1" aria-label="Previous month">&#8249;</button><b>${fmt(st.m, { month: 'long', year: 'numeric' })}</b><button class="ib" data-m="1" aria-label="Next month">&#8250;</button><button class="sel" data-m="0">Today</button></div>
      </div>
      <div class="calgrid">
        <div><div class="month">${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(x => `<div class="dow">${x}</div>`).join('')}${cells}</div>
          <div class="legend"><span><i style="background:var(--del-bg)"></i>Due date</span><span><i style="background:var(--accent-soft)"></i>Requirement starts</span><span><i style="background:var(--sunk)"></i>New version issued</span><span><i style="background:color-mix(in srgb, var(--accent-soft) 45%, var(--panel))"></i>Reporting window</span></div></div>
        <aside class="agenda"><h2>${pick ? 'Selected' : 'Coming up'}</h2><ol>${items.slice(0, 7).map(e => `<li class="card2 ${e.kind}${pick === e ? ' sel' : ''}">
          <div class="dt"><b>${e.d.getDate()}</b><span>${fmt(e.d, { month: 'short' })} ${String(e.d.getFullYear()).slice(2)}</span></div>
          <div class="tt">${esc(e.title)}</div>
          <div class="dd">${esc(e.detail)}${e.e ? ` Through ${fmt(e.e, { month: 'short', day: 'numeric', year: 'numeric' })}.` : ''}</div>
          ${e.changed ? `<div class="chgd">${esc(e.changed)}</div>` : ''}
          <div class="soon">${e.d >= today ? `In ${days(e)} days · ` : ''}${esc(LBL[e.doc])} · <a href="${link(e)}">${esc(e.cite || 'See what changed')} &rarr;</a></div>
        </li>`).join('')}</ol></aside>
      </div></div>`;
  }
  root.addEventListener('click', e => {
    const f = e.target.closest('[data-f]'); if (f) { st.f = f.dataset.f; st.sel = null; draw(); return; }
    const m = e.target.closest('[data-m]'); if (m) { const k = +m.dataset.m; st.m = k ? new Date(st.m.getFullYear(), st.m.getMonth() + k, 1) : new Date(today.getFullYear(), today.getMonth(), 1); draw(); return; }
    const b = e.target.closest('.ev'); if (b) { st.sel = +b.dataset.k; draw(); }
  }, { signal });
  draw();
}

// ---------- the library: which documents there are, and switching between them ----------
(async function () {
  // Data loading. On a web server (Cloudflare) the page fetches the .json files.
  // Opened straight from a folder (file://), browsers block that, so it loads the
  // .js copy of each file instead, which browsers allow.
  const LOCAL = location.protocol === 'file:';
  window.__DATA = window.__DATA || {};
  const loadJSON = path => LOCAL
    ? new Promise((ok, bad) => {
        if (window.__DATA[path]) return ok(window.__DATA[path]);
        const sc = document.createElement('script'); sc.src = path.replace(/\.json$/, '.js');
        sc.onload = () => window.__DATA[path] ? ok(window.__DATA[path]) : bad(new Error(path + ' is missing'));
        sc.onerror = () => bad(new Error(path + ' is missing'));
        document.head.appendChild(sc);
      })
    : fetch(path).then(r => { if (!r.ok) throw new Error(path + ' (' + r.status + ')'); return r.json(); });
  let lib;
  try { lib = await loadJSON('data/library.json'); }
  catch (e) {
    document.getElementById('doc').innerHTML = `<p class="loading">Could not load the data files (${e.message}). Keep index.html and the data folder together in one folder.</p>`;
    return;
  }
  let ctl = null;
  const docOf = () => { const id = decodeURIComponent(location.hash.slice(1)).split('/')[0]; return lib.documents.find(d => d.id === id) || lib.documents[0]; };
  function tabs(cur) {
    document.getElementById('docs').innerHTML = lib.documents.map(d =>
      `<button data-doc="${d.id}" aria-pressed="${d.id === cur.id}">${d.label}<small>${d.sub}</small></button>`).join('');
  }
  async function load(d, keepHash) {
    if (ctl) ctl.abort();
    ctl = new AbortController();
    tabs(d);
    document.getElementById('doc').innerHTML = '<p class="loading">Loading ' + d.label + '…</p>';
    if (!keepHash) try { history.replaceState(null, '', '#' + d.id); } catch (e) {}
    document.querySelector('.app').classList.toggle('cal', d.kind === 'calendar');
    if (d.kind === 'calendar') {
      document.getElementById('brand').innerHTML = 'Change Tracker<small>Deadlines across the BHSA Manual and BHINs &middot; DHCS</small>';
      try { const data = await fetch('data/deadlines.json').then(r => r.json()); document.getElementById('doc').innerHTML = ''; calendar(document.getElementById('doc'), data, ctl.signal); }
      catch (e) { document.getElementById('doc').innerHTML = '<p class="loading">Could not load deadlines.</p>'; }
      return;
    }
    const get = f => loadJSON(`data/${d.id}/${f}.json`);
    try {
      const [D, SUB, CFG] = await Promise.all([get('history'), get('judgments'), get('config')]);
      document.getElementById('main').scrollTop = 0;
      boot(D, SUB, CFG, d.id, ctl.signal);
    } catch (e) {
      document.getElementById('doc').innerHTML = '<p class="loading">Could not load ' + d.label + ' (' + e.message + ').</p>';
    }
  }
  document.getElementById('docs').addEventListener('click', e => { const b = e.target.closest('[data-doc]'); if (b) load(lib.documents.find(d => d.id === b.dataset.doc)); });
  // Links between views (a calendar date to its section) change the address.
  window.addEventListener('hashchange', () => load(docOf(), true));
  load(docOf(), true);
})();

// Ask sits on top of the tracker. It calls the local server, which uses the
// same chat client as the PDF question command and searches this document's sections.
(function () {
  const pane = document.getElementById('askpane');
  const body = document.getElementById('askbody');
  const opener = document.getElementById('askopen');
  const form = document.getElementById('askform');
  const submit = form.querySelector('button');
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let busy = false;
  const setOpen = open => {
    pane.classList.toggle('open', open);
    opener.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) document.getElementById('askq').focus();
  };
  opener.addEventListener('click', () => setOpen(true));
  document.getElementById('askclose').addEventListener('click', () => setOpen(false));
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && pane.classList.contains('open')) setOpen(false);
  });
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    if (busy) return;
    const question = document.getElementById('askq').value.trim();
    if (!question) { body.innerHTML = '<p class="askerr">Enter a question.</p>'; return; }
    const document_id = decodeURIComponent(location.hash.slice(1)).split('/')[0];
    busy = true;
    submit.disabled = true;
    body.innerHTML = '<p class="ai">Searching the sections and writing an answer…</p>';
    let response;
    try {
      response = await fetch('/api/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          question,
          document_id,
          provider: document.getElementById('askprovider').value,
        }),
      });
    } catch (err) {
      body.innerHTML = '<p class="askerr">Ask needs the local server. From the document-rag folder, run: uv run document-rag-site</p>';
      return;
    } finally {
      busy = false;
      submit.disabled = false;
    }
    let payload = {};
    try { payload = await response.json(); } catch (err) { payload = { error: 'The server sent an unreadable response.' }; }
    if (!response.ok || payload.error) {
      body.innerHTML = `<p class="askerr">${esc(payload.error || 'The question could not be answered.')}</p>`;
      return;
    }
    const sources = (payload.sources || []).map(source => `<div class="src"><a href="${esc(source.href || '#')}">${esc(source.source_id || '')} ${esc(source.title || '')}</a><p>${esc(source.version || '')}${source.page ? ' · p.' + esc(source.page) : ''}</p><p>${esc((source.text || '').slice(0, 420))}</p></div>`).join('');
    body.innerHTML = `<div class="ans">${esc(payload.answer || '')}</div>${sources}`;
  });
})();
</script>
